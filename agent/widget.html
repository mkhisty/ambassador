<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · Ambassador</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: light-dark(#f2f3f7,#15161a); color: light-dark(#191b25,#f4f4f8); }
  main { max-width: 480px; margin: auto; padding: 22px; border: 1px solid light-dark(#e2e3eb,#393a43); border-radius: 22px; background: light-dark(white,#22232a); }
  small { color: light-dark(#6c6d7a,#b0b1c0); }
  h1 { font-size: 22px; margin: 8px 0 18px; }
  pre { font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
  textarea { width: 100%; min-height: max(220px, 45dvh); font: inherit; line-height: 1.5; padding: 12px; border-radius: 12px; border: 1px solid #818292; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  button { border: 0; border-radius: 12px; padding: 12px 16px; font: inherit; font-weight: 600; cursor: pointer; background: light-dark(#edeef4,#3b3c47); color: inherit; }
  .primary { background: #5351e8; color: white; }
  button:disabled { opacity: .5; cursor: default; }
  .calendar { margin: 16px 0; padding: 12px; border-radius: 12px; background: light-dark(#f2f3f7,#30313a); }
  dl { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; line-height: 1.4; margin: 0; }
  dt { color: light-dark(#6c6d7a,#b0b1c0); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .calendar-link { display: inline-block; margin-top: 10px; color: #7775ff; }
  [hidden] { display: none !important; }
  #status { font-size: 14px; line-height: 1.5; }
</style>
<main data-finished="__FINISHED__" data-kind="__KIND_ID__">
  <small>AMBASSADOR · __KIND__</small>
  <h1>__TITLE__</h1>
  <pre id="response">__RESPONSE__</pre>
  <section class="calendar" id="calendar-details" __CALENDAR_HIDDEN__>__CALENDAR_DETAILS__</section>
  <section class="calendar" id="email-details" __EMAIL_HIDDEN__>__EMAIL_DETAILS__</section>
  <section id="editor" hidden>
    <label for="text">Edit response</label>
    <textarea id="text" maxlength="20000"></textarea>
  </section>
  <section class="calendar" id="email-editor" hidden>
    <label>To<input id="email-recipient" type="email" maxlength="254"></label>
    <label>Subject<input id="email-subject" maxlength="500"></label>
    <label>CC<input id="email-cc" placeholder="Comma-separated email addresses"></label>
    <label>BCC<input id="email-bcc" placeholder="Comma-separated email addresses"></label>
    <label>Message<textarea id="email-body" maxlength="20000"></textarea></label>
  </section>
  <div class="actions" id="review-actions">
    <button class="primary" id="approve">__APPROVE_LABEL__</button>
    <button id="edit" __EDIT_HIDDEN__>Edit</button>
    <button id="reject">Reject</button>
  </div>
  <div class="actions" id="edit-actions" hidden>
    <button class="primary" id="edit-approve">__EDIT_LABEL__</button>
    <button id="cancel">Cancel</button>
  </div>
  <p id="status" role="status" aria-live="polite">__STATUS__</p>
  <a class="calendar-link" id="calendar-link" hidden target="_blank" rel="noreferrer">Open in Google Calendar</a>
  <small>Messages and email are sent only after approval. Calendar events are created only after approval.</small>
</main>
<script src="/widget.js" defer></script>
</html>
